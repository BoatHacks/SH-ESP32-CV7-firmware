[platformio]
default_envs = sh-esp32

[env:sh-esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D USE_ESP_IDF_LOG
    -D TAG='"Arduino"'
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2
build_unflags =
    -Werror=reorder
    -std=gnu++11
lib_ignore =
    esp_websocket_client
lib_deps =
    SignalK/SensESP@3.6.0
    ttlappalainen/NMEA2000-library@4.24.1
    ttlappalainen/NMEA2000_esp32@1.0.3
board_build.partitions = min_spiffs.csv
build_src_filter =
    +<*>
extra_scripts =
    pre:scripts/version.py

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Isrc
build_src_filter =
    -<*>
    +<nmea0183/>
    +<conditioning/>
